name: Actualisation météo

on:
  workflow_dispatch:
  schedule:
    - cron: '3,33 * * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: write

concurrency:
  group: pixel-sync-meteo
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Actualiser les prévisions
        run: python3 meteo.py --sortie meteo.json

      - name: Publier meteo.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- meteo.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Actualisation météo'
          for tentative in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1

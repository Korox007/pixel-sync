name: Data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18,20,4 * * *'

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest -v test_extract.py
      - name: Extract
        run: python3 extract.py --sortie schedule.json
      - name: Publish
        run: python3 publish.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Refresh data' && git push)
